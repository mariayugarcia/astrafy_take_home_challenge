version: 2

models:

  # STAGING

  - name: stg_orders
    description: "Cleaned order-level data."

    columns:
      - name: order_id
        description: "Unique identifier of an order."
        tests:
          - not_null
          - unique

      - name: client_id
        description: "Identifier of the customer."
        tests:
          - not_null

      - name: order_date
        description: "Date when the order was placed."
        tests:
          - not_null


  - name: stg_sales
    description: "Cleaned sales lines at product level."

    columns:
      - name: order_id
        description: "Identifier of the order."
        tests:
          - not_null

      - name: product_id
        description: "Identifier of the product."

      - name: quantity
        description: "Quantity of products in the sales line."


  # INTERMEDIATE

  - name: int_order_products
    description: "Total quantity of products for each order."

    columns:
      - name: order_id
        description: "Unique identifier of the order."
        tests:
          - not_null
          - unique

      - name: qty_product
        description: "Total quantity of products in the order."
        tests:
          - not_null


  - name: int_order_history
    description: "Customer order history used for segmentation."

    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: client_id
        tests:
          - not_null

      - name: order_date
        tests:
          - not_null

      - name: previous_orders_12m
        description: "Number of orders placed by the customer during the previous 12 months."
        tests:
          - not_null


  # MARTS

  - name: fct_orders
    description: "One row per order for 2025 and 2026."

    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: client_id
        tests:
          - not_null

      - name: order_date
        tests:
          - not_null

      - name: qty_product
        tests:
          - not_null


  - name: fct_orders_2026
    description: "One row per order in 2026 with customer segmentation."

    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: client_id
        tests:
          - not_null

      - name: order_date
        tests:
          - not_null

      - name: order_segmentation
        description: "Customer segment based on previous 12-month order history."
        tests:
          - not_null
          - accepted_values:
              values:
                - New
                - Returning
                - VIP
