version: 2

models:
  - name: stg_sales
    description: >
      Staging model for the raw sales-line dataset. Standardizes data types
      and renames source columns to business-friendly names.

    columns:
      - name: sales_date
        description: Date on which the sales line was recorded.
        data_tests:
          - not_null

      - name: customer_id
        description: Unique identifier of the customer associated with the order.
        data_tests:
          - not_null

      - name: order_id
        description: Identifier of the order associated with the sales line.
        data_tests:
          - not_null

      - name: product_id
        description: Identifier of the product included in the sales line.
        data_tests:
          - not_null

      - name: net_sales
        description: Net sales amount generated by the sales line.
        data_tests:
          - not_null

      - name: quantity
        description: Quantity of products included in the sales line.
        data_tests:
          - not_null