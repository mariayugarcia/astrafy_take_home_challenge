version: 2

models:

  - name: int_order_products
    description: "Total quantity of products for each order."

    columns:

      - name: order_id
        description: "Unique identifier of the order."
        tests:
          - not_null
          - unique

      - name: qty_product
        description: "Total quantity of products in the order."
        tests:
          - not_null


  - name: int_order_history
    description: "Order history used to calculate customer segmentation."

    columns:

      - name: order_id
        description: "Unique identifier of the order."
        tests:
          - not_null
          - unique

      - name: client_id
        description: "Customer identifier."
        tests:
          - not_null

      - name: order_date
        description: "Date of the order."
        tests:
          - not_null

      - name: previous_orders_12m
        description: "Number of orders placed by the customer during the previous 12 months."
        tests:
          - not_null
